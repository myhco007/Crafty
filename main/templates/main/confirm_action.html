{% extends 'main/base.html' %}
{% load static %}
{% block title %}- {{ title }}{% endblock %}
{% block page_css %}
<style>
.confirm-box {
    max-width: 500px;
    margin: 60px auto;
    background: var(--white);
    padding: 40px;
    border-radius: var(--radius);
    text-align: center;
    box-shadow: var(--shadow);
    border: 2px dashed {% if is_destructive %}var(--pink){% else %}var(--green){% endif %};
}
.confirm-title {
    font-family: 'Fredoka One', cursive;
    color: {% if is_destructive %}var(--pink){% else %}var(--green){% endif %};
    font-size: 1.8rem;
    margin-bottom: 10px;
}
.confirm-text {
    font-size: 1.1rem;
    color: var(--gray);
    margin-bottom: 30px;
}
.confirm-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
}
.btn-action {
    background: {% if is_destructive %}var(--pink){% else %}var(--green){% endif %};
    color: var(--white);
    font-family: 'Fredoka One', cursive;
    padding: 12px 24px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    box-shadow: 0 4px 0 {% if is_destructive %}#d84b7a{% else %}#27ae60{% endif %};
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn-action:hover {
    transform: translateY(2px);
    box-shadow: 0 2px 0 {% if is_destructive %}#d84b7a{% else %}#27ae60{% endif %};
}
.btn-cancel {
    background: #f1f1f1;
    color: var(--gray);
    font-weight: 800;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
}
.btn-cancel:hover {
    background: #e0e0e0;
    color: var(--dark);
}
</style>
{% endblock %}
{% block content %}

<div class="confirm-box">
    <div style="font-size: 4rem; margin-bottom: 20px;">{{ icon }}</div>
    <h1 class="confirm-title">{{ title }}</h1>
    <p class="confirm-text">
        {{ message|safe }}
    </p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="confirm-actions">
            <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-action">
                {{ btn_text }}
            </button>
        </div>
    </form>
</div>

{% endblock %}
